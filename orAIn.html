<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orion Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@2.5.0/dist/purify.min.js"></script>
<style>
:root {
  --bg:         #0d0f16;
  --sidebar-bg: #0a0c12;
  --panel:      #10131c;
  --border:     #1c2235;
  --accent:     #4a90d9;
  --accent-dim: #1e3a5f;
  --purple:     #6d4f9e;
  --text:       #ccd6e8;
  --text-dim:   #4a5568;
  --text-mid:   #7a8fa8;
  --user-bg:    #112040;
  --user-bdr:   #1a3d70;
  --orion-bg:   #0c1020;
  --orion-bdr:  #1a2238;
  --input-bg:   #080b14;
  --hover:      #141828;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; }

#shell { display: flex; height: 100dvh; }

/* Sidebar */
#sidebar {
  width: 240px; flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sb-logo {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.sb-logo-text {
  font-size: 1.15rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent);
}
.sb-new {
  margin: 10px 10px 4px;
  padding: 7px 12px;
  background: transparent; border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-mid);
  font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em;
  cursor: pointer; text-align: left;
  transition: background 0.12s, color 0.12s;
  display: flex; align-items: center; gap: 8px;
}
.sb-new:hover { background: var(--hover); color: var(--text); }
.sb-section {
  padding: 10px 14px 4px;
  font-family: 'Share Tech Mono', monospace; font-size: 0.58rem;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim);
}
#historyList { flex: 1; overflow-y: auto; padding: 0 6px; }
#historyList::-webkit-scrollbar { width: 3px; }
#historyList::-webkit-scrollbar-thumb { background: var(--border); }
.hist-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 4px; cursor: pointer;
  font-size: 0.88rem; color: var(--text-mid);
  transition: background 0.1s, color 0.1s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hist-item:hover { background: var(--hover); color: var(--text); }
.hist-item.active { background: var(--accent-dim); color: var(--text); }
.hist-item svg { flex-shrink: 0; opacity: 0.5; }
.sb-bottom { border-top: 1px solid var(--border); padding: 8px 10px; }
.sb-clear {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 4px; cursor: pointer;
  font-size: 0.85rem; color: var(--text-dim);
  transition: background 0.1s, color 0.1s;
  background: none; border: none;
  font-family: 'Rajdhani', sans-serif; font-weight: 600; letter-spacing: 0.06em;
  width: 100%; text-align: left;
}
.sb-clear:hover { background: var(--hover); color: #e05555; }
.sb-personality {
  margin: 0 10px 6px;
  padding: 7px 12px;
  background: transparent; border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-mid);
  font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em;
  cursor: pointer; text-align: left;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  display: flex; align-items: center; gap: 8px; width: calc(100% - 20px);
}
.sb-personality:hover { background: var(--hover); color: var(--text); border-color: var(--purple); }
.sb-personality.active { border-color: var(--purple); color: #b090e8; }

/* Modal overlay */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.65); z-index: 100;
  align-items: center; justify-content: center;
  backdrop-filter: blur(3px);
}
#modal-overlay.open { display: flex; }
#modal {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; width: 480px; max-width: 92vw;
  display: flex; flex-direction: column; overflow: hidden;
  animation: modalin 0.18s ease;
}
@keyframes modalin { from { opacity:0; transform:scale(0.96) translateY(8px); } to { opacity:1; transform:none; } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.modal-title {
  font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text);
}
.modal-close {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 1.2rem; line-height: 1; padding: 2px 6px; border-radius: 3px;
  transition: color 0.1s, background 0.1s;
}
.modal-close:hover { color: var(--text); background: var(--border); }
.modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-label {
  font-family: 'Share Tech Mono', monospace; font-size: 0.62rem;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
}
.preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.preset-btn {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 8px 10px; color: var(--text-mid);
  font-family: 'Rajdhani', sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;
  cursor: pointer; text-align: center;
  transition: background 0.1s, border-color 0.1s, color 0.1s;
}
.preset-btn:hover { background: var(--hover); color: var(--text); border-color: var(--accent-dim); }
.preset-btn.selected { border-color: var(--purple); color: #b090e8; background: rgba(109,79,158,0.12); }
#customPrompt {
  width: 100%; height: 100px; resize: none;
  background: var(--input-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 10px 12px;
  font-family: 'Rajdhani', sans-serif; font-size: 0.92rem; line-height: 1.45;
  outline: none; transition: border-color 0.15s;
}
#customPrompt:focus { border-color: var(--accent-dim); }
#customPrompt::placeholder { color: var(--text-dim); font-size: 0.85rem; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 16px; }
.btn-cancel {
  background: transparent; border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-dim); padding: 7px 18px;
  font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em;
  cursor: pointer; transition: background 0.1s, color 0.1s;
}
.btn-cancel:hover { background: var(--hover); color: var(--text); }
.btn-apply {
  background: rgba(109,79,158,0.2); border: 1px solid var(--purple); border-radius: 4px;
  color: #b090e8; padding: 7px 18px;
  font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em;
  cursor: pointer; transition: background 0.1s;
}
.btn-apply:hover { background: rgba(109,79,158,0.35); }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#topbar {
  display: flex; align-items: center;
  padding: 0 18px; height: 44px;
  border-bottom: 1px solid var(--border);
  background: var(--panel); gap: 10px; flex-shrink: 0;
}
#topbar-title {
  font-size: 0.9rem; font-weight: 600; color: var(--text-mid);
  letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px;
}
.model-pill {
  margin-left: auto;
  font-family: 'Share Tech Mono', monospace; font-size: 0.62rem;
  color: var(--text-dim); background: var(--border);
  padding: 3px 9px; border-radius: 10px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
}

/* Chat */
#chat { flex: 1; overflow-y: auto; padding: 24px 0; scroll-behavior: smooth; }
#chat::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.chat-inner { max-width: 740px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }

/* Welcome */
#welcome {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 20px 20px; gap: 28px;
}
.welcome-logo { opacity: 0.2; }
.welcome-title { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.welcome-sub { font-family: 'Share Tech Mono', monospace; font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.08em; margin-top: -18px; }
.suggestions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 640px; }
.sug-btn {
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 14px; color: var(--text-mid);
  font-family: 'Rajdhani', sans-serif; font-size: 0.88rem; font-weight: 500; line-height: 1.4;
  cursor: pointer; text-align: left;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.sug-btn:hover { background: var(--hover); border-color: var(--accent-dim); color: var(--text); }

/* Messages */
.msg { display: flex; gap: 12px; animation: fadein 0.15s ease; }
@keyframes fadein { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; margin-top: 2px;
}
.msg.user { flex-direction: row-reverse; }
.msg.user .msg-avatar { background: var(--user-bdr); }
.msg.orion .msg-avatar { background: var(--purple); }
.msg-body { flex: 1; min-width: 0; }
.msg-name {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px;
}
.msg.user .msg-name { text-align: right; color: #2a5a90; }
.msg-bubble {
  display: inline-block; padding: 10px 14px; border-radius: 6px;
  font-size: 0.97rem; line-height: 1.6; max-width: 100%; word-break: break-word;
}
.msg.user .msg-bubble {
  background: var(--user-bg); border: 1px solid var(--user-bdr); color: #9dc4f0; float: right; clear: both;
}
.msg.orion .msg-bubble {
  background: var(--orion-bg); border: 1px solid var(--orion-bdr);
  border-left: 2px solid var(--purple); color: var(--text);
}
.msg.orion .msg-body { clear: both; }
.msg-bubble p { margin: 0 0 0.5em; }
.msg-bubble p:last-child { margin: 0; }
.msg-bubble strong { color: #ddeeff; }
.msg-bubble ul, .msg-bubble ol { padding-left: 1.4em; margin: 0.4em 0; }
.msg-bubble li { margin: 0.15em 0; }
.msg-bubble code { font-family: 'Share Tech Mono', monospace; font-size: 0.83em; background: rgba(255,255,255,0.07); padding: 1px 5px; border-radius: 3px; }
.msg-bubble pre { background: #07090f; border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; overflow-x: auto; margin: 8px 0; }
.msg-bubble pre code { background: none; padding: 0; font-size: 0.82em; }
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3 { font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 0.06em; margin: 0.6em 0 0.3em; color: #b8d4f0; }

/* Typing dots */
.typing-dots span { display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin: 0 2px; animation: blink 1.1s infinite; opacity: 0.5; vertical-align: middle; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.15} 40%{opacity:1} }

/* Input */
#inputbar { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; flex-shrink: 0; }
.input-wrap { max-width: 740px; margin: 0 auto; position: relative; }
#prompt {
  width: 100%; min-height: 52px; max-height: 200px; resize: none;
  background: var(--input-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 14px 52px 14px 16px;
  font-family: 'Rajdhani', sans-serif; font-size: 0.97rem; line-height: 1.45;
  outline: none; overflow-y: auto; transition: border-color 0.15s;
}
#prompt:focus { border-color: var(--accent-dim); }
#prompt::placeholder { color: var(--text-dim); }
#sendBtn {
  position: absolute; right: 10px; bottom: 10px;
  width: 34px; height: 34px; border-radius: 5px;
  background: var(--accent-dim); border: 1px solid var(--accent-dim);
  color: var(--accent); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s;
}
#sendBtn:hover:not(:disabled) { background: #1c3d6e; }
#sendBtn:disabled { opacity: 0.3; cursor: default; }
.input-hint { text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 0.58rem; color: var(--text-dim); letter-spacing: 0.06em; margin-top: 6px; }
</style>
</head>
<body>
<div id="shell">

<nav id="sidebar">
  <div class="sb-logo">
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="5"  r="1.8" fill="#4a90d9"/>
      <circle cx="8"  cy="13" r="1.4" fill="#6d4f9e"/>
      <circle cx="24" cy="13" r="1.4" fill="#6d4f9e"/>
      <circle cx="11" cy="21" r="1.1" fill="#4a90d9" opacity="0.7"/>
      <circle cx="21" cy="21" r="1.1" fill="#4a90d9" opacity="0.7"/>
      <circle cx="16" cy="27" r="1.6" fill="#4a90d9"/>
      <circle cx="13" cy="16.5" r="1" fill="#ccd6e8" opacity="0.9"/>
      <circle cx="16" cy="16.5" r="1" fill="#ccd6e8" opacity="0.9"/>
      <circle cx="19" cy="16.5" r="1" fill="#ccd6e8" opacity="0.9"/>
      <line x1="16" y1="6.8" x2="9" y2="11.6" stroke="#4a90d9" stroke-width="0.4" opacity="0.25"/>
      <line x1="16" y1="6.8" x2="23" y2="11.6" stroke="#4a90d9" stroke-width="0.4" opacity="0.25"/>
      <line x1="11" y1="22.2" x2="16" y2="25.4" stroke="#4a90d9" stroke-width="0.4" opacity="0.25"/>
      <line x1="21" y1="22.2" x2="16" y2="25.4" stroke="#4a90d9" stroke-width="0.4" opacity="0.25"/>
    </svg>
    <span class="sb-logo-text">Orion</span>
  </div>
  <button class="sb-new" id="newChatBtn">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/></svg>
    New Chat
  </button>
  <button class="sb-personality" id="personalityBtn">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.8" stroke="currentColor" stroke-width="1.3"/><path d="M2 14.5c0-2.8 2.7-5 6-5s6 2.2 6 5" stroke="currentColor" stroke-width="1.3"/><path d="M11.5 2.5 L14 1 M14 1 L13.5 3.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
    Personality
  </button>
  <div class="sb-section">Recent</div>
  <div id="historyList"></div>
  <div class="sb-bottom">
    <button class="sb-clear" id="clearAllBtn">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><polyline points="3,4 13,4" stroke="currentColor" stroke-width="1.4"/><path d="M5 4V3h6v1" stroke="currentColor" stroke-width="1.3"/><rect x="4" y="5" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
      Clear conversations
    </button>
  </div>
</nav>

<div id="main">
  <div id="topbar">
    <div id="topbar-title">New Chat</div>
    <div class="model-pill" id="modelPill">Loading...</div>
  </div>
  <div id="chat">
    <div id="welcome">
      <svg class="welcome-logo" width="56" height="56" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="5"  r="1.8" fill="#4a90d9"/>
        <circle cx="8"  cy="13" r="1.4" fill="#6d4f9e"/>
        <circle cx="24" cy="13" r="1.4" fill="#6d4f9e"/>
        <circle cx="11" cy="21" r="1.1" fill="#4a90d9"/>
        <circle cx="21" cy="21" r="1.1" fill="#4a90d9"/>
        <circle cx="16" cy="27" r="1.6" fill="#4a90d9"/>
        <circle cx="13" cy="16.5" r="1" fill="#ccd6e8"/>
        <circle cx="16" cy="16.5" r="1" fill="#ccd6e8"/>
        <circle cx="19" cy="16.5" r="1" fill="#ccd6e8"/>
      </svg>
      <div class="welcome-title">Orion Chat</div>
      <div class="welcome-sub">Powered by Orion Games</div>
      <div class="suggestions">
        <button class="sug-btn">Explain how black holes form</button>
        <button class="sug-btn">Write a short Roblox Lua script</button>
        <button class="sug-btn">What is quantum entanglement?</button>
        <button class="sug-btn">Debug my code and explain the fix</button>
        <button class="sug-btn">Summarize a topic I paste in</button>
        <button class="sug-btn">Help me brainstorm game ideas</button>
      </div>
    </div>
  </div>
  <div id="inputbar">
    <div class="input-wrap">
      <textarea id="prompt" placeholder="Message Orion..."></textarea>

        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 14L14 8L2 2V6.5L10 8L2 9.5V14Z" fill="currentColor"/></svg>

</div>

</div>
<!-- Personality Modal -->
<div id="modal-overlay">
  <div id="modal">
    <div class="modal-header">
      <span class="modal-title">Personality</span>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <div>
        <div class="modal-label">Quick Presets</div>
        <div class="preset-grid">
          <button class="preset-btn" data-preset="You are a helpful, friendly, and concise assistant.">Default</button>
          <button class="preset-btn" data-preset="You are a professional assistant. Be formal, precise, and thorough. Use structured responses where appropriate.">Professional</button>
          <button class="preset-btn" data-preset="You are a casual and fun assistant. Keep it relaxed, use informal language, and feel free to be playful.">Casual</button>
          <button class="preset-btn" data-preset="You are a coding assistant. Focus on code quality, explain your reasoning, and always include working examples. Prefer concise answers.">Coder</button>
          <button class="preset-btn" data-preset="You are a creative writing assistant. Be expressive, imaginative, and help craft vivid and engaging content.">Creative</button>
          <button class="preset-btn" data-preset="You are a Socratic tutor. Never give direct answers — guide the user to think through problems themselves with questions and hints.">Tutor</button>
        </div>
      </div>
      <div>
        <div class="modal-label">Custom Prompt</div>
        <textarea id="customPrompt" placeholder="Describe how Orion should behave, what tone to use, what it knows..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="modalCancel">Cancel</button>
      <button class="btn-apply" id="modalApply">Apply</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://freeai.logise1123.workers.dev/";
const SYSTEM_PROMPT = "You are a helpful assistant.";

const MODELS = [
  {label:'LLaMA 4 Scout 17B',   id:'llama-4-scout-17b-16e-instruct'},
  {label:'LLaMA 3.3 70B',       id:'llama-3.3-70b-instruct-fp8-fast'},
  {label:'LLaMA 3.1 70B',       id:'llama-3.1-70b-instruct'},
  {label:'QwQ 32B',             id:'qwq-32b'},
  {label:'DeepSeek R1 32B',     id:'deepseek-r1-distill-qwen-32b'},
  {label:'Qwen2.5 Coder 32B',   id:'qwen2.5-coder-32b-instruct'},
  {label:'Mistral Small 24B',   id:'mistral-small-3.1-24b-instruct'},
  {label:'Gemma 3 12B',         id:'gemma-3-12b-it'},
  {label:'LLaMA 3.1 8B',        id:'llama-3.1-8b-instruct-fast'},
  {label:'Mistral 7B',          id:'mistral-7b-instruct-v0.2'},
];
function mSize(id){const m=/(\d+(?:\.\d+)?)[bB]/.exec(id);return m?parseFloat(m[1]):0;}
MODELS.sort((a,b)=>mSize(b.id)-mSize(a.id));

let sessions=[], activeId=null, modelIdx=0, busy=false;
let currentSystemPrompt = SYSTEM_PROMPT;

const chatEl     = document.getElementById('chat');
const promptEl   = document.getElementById('prompt');
const sendBtn    = document.getElementById('sendBtn');
const modelPill  = document.getElementById('modelPill');
const topTitle   = document.getElementById('topbar-title');
const histList   = document.getElementById('historyList');

function activeSession(){return sessions.find(s=>s.id===activeId)||null;}
function updatePill(){modelPill.textContent=MODELS[modelIdx].label;}
updatePill();

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderSidebar(){
  histList.innerHTML='';
  [...sessions].reverse().forEach(s=>{
    const d=document.createElement('div');
    d.className='hist-item'+(s.id===activeId?' active':'');
    d.innerHTML=`<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 2h12v10H9l-3 2v-2H2z" stroke="currentColor" stroke-width="1.3" fill="none"/></svg><span>${escHtml(s.title)}</span>`;
    d.onclick=()=>loadSession(s.id);
    histList.appendChild(d);
  });
}

function newSession(){
  const id=Date.now().toString();
  sessions.push({id,title:'New Chat',history:[{role:'system',content:currentSystemPrompt||SYSTEM_PROMPT}]});
  loadSession(id);
}

function loadSession(id){
  activeId=id;
  const s=activeSession();
  topTitle.textContent=s.title;
  modelIdx=0; updatePill();
  renderSidebar();
  rebuildChat(s);
}

function rebuildChat(s){
  const old=chatEl.querySelector('.chat-inner');
  if(old) old.remove();
  const msgs=s.history.filter(m=>m.role!=='system');
  if(msgs.length===0){showWelcome();return;}
  const w=document.getElementById('welcome');
  if(w) w.remove();
  const inner=document.createElement('div');
  inner.className='chat-inner';
  chatEl.appendChild(inner);
  msgs.forEach(m=>renderBubble(m.role==='user'?'user':'orion',m.content,inner,false));
  chatEl.scrollTop=chatEl.scrollHeight;
}

function showWelcome(){
  if(document.getElementById('welcome')) return;
  const w=document.createElement('div');
  w.id='welcome';
  w.innerHTML=`
    <svg class="welcome-logo" width="56" height="56" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="5" r="1.8" fill="#4a90d9"/>
      <circle cx="8" cy="13" r="1.4" fill="#6d4f9e"/>
      <circle cx="24" cy="13" r="1.4" fill="#6d4f9e"/>
      <circle cx="11" cy="21" r="1.1" fill="#4a90d9"/>
      <circle cx="21" cy="21" r="1.1" fill="#4a90d9"/>
      <circle cx="16" cy="27" r="1.6" fill="#4a90d9"/>
      <circle cx="13" cy="16.5" r="1" fill="#ccd6e8"/>
      <circle cx="16" cy="16.5" r="1" fill="#ccd6e8"/>
      <circle cx="19" cy="16.5" r="1" fill="#ccd6e8"/>
    </svg>
    <div class="welcome-title">Orion Chat</div>
    <div class="welcome-sub">Powered by Orion Games</div>
    <div class="suggestions">
      <button class="sug-btn">Explain how black holes form</button>
      <button class="sug-btn">Write a short Roblox Lua script</button>
      <button class="sug-btn">What is quantum entanglement?</button>
      <button class="sug-btn">Debug my code and explain the fix</button>
      <button class="sug-btn">Summarize a topic I paste in</button>
      <button class="sug-btn">Help me brainstorm game ideas</button>
    </div>`;
  chatEl.insertBefore(w,chatEl.firstChild);
  bindSug();
}

function bindSug(){
  document.querySelectorAll('.sug-btn').forEach(b=>{
    b.onclick=()=>{promptEl.value=b.textContent;sendMessage();};
  });
}
bindSug();

function renderBubble(role,content,container,animate=true){
  const isUser=role==='user';
  const wrap=document.createElement('div');
  wrap.className=`msg ${isUser?'user':'orion'}`;
  if(!animate) wrap.style.animation='none';

  const avatar=document.createElement('div');
  avatar.className='msg-avatar';
  avatar.innerHTML=isUser
    ?`<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="3" stroke="#7ab4e8" stroke-width="1.4"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#7ab4e8" stroke-width="1.4"/></svg>`
    :`<svg width="14" height="14" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="5" r="1.8" fill="#9d80d0"/><circle cx="10" cy="12" r="1.2" fill="#9d80d0"/><circle cx="22" cy="12" r="1.2" fill="#9d80d0"/><circle cx="13" cy="17" r="0.9" fill="#ccd6e8"/><circle cx="16" cy="17" r="0.9" fill="#ccd6e8"/><circle cx="19" cy="17" r="0.9" fill="#ccd6e8"/><circle cx="16" cy="24" r="1.4" fill="#9d80d0"/></svg>`;

  const body=document.createElement('div');
  body.className='msg-body';
  const name=document.createElement('div');
  name.className='msg-name';
  name.textContent=isUser?'You':'Orion';
  const bubble=document.createElement('div');
  bubble.className='msg-bubble';

  if(content==='__typing__'){
    bubble.innerHTML=`<span class="typing-dots"><span></span><span></span><span></span></span>`;
  } else {
    bubble.innerHTML=DOMPurify.sanitize(marked.parse(content));
  }

  body.appendChild(name);
  body.appendChild(bubble);
  wrap.appendChild(avatar);
  wrap.appendChild(body);
  container.appendChild(wrap);
  return wrap;
}

function getOrCreateInner(){
  const w=document.getElementById('welcome');
  if(w) w.remove();
  let inner=chatEl.querySelector('.chat-inner');
  if(!inner){inner=document.createElement('div');inner.className='chat-inner';chatEl.appendChild(inner);}
  return inner;
}

async function callApi(payload,attempt=0){
  if(attempt>=MODELS.length) throw new Error('Unavailable.');
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  }catch(e){
    modelIdx=(modelIdx+1)%MODELS.length;
    updatePill();
    return callApi({...payload,model:MODELS[modelIdx].id},attempt+1);
  }
}

async function sendMessage(){
  if(busy) return;
  const text=promptEl.value.trim();
  if(!text) return;
  if(!activeId) newSession();
  const s=activeSession();
  promptEl.value='';
  promptEl.style.height='auto';
  busy=true; sendBtn.disabled=true;
  s.history.push({role:'user',content:text});
  if(s.title==='New Chat'){s.title=text.length>36?text.slice(0,36)+'…':text;topTitle.textContent=s.title;}
  const inner=getOrCreateInner();
  renderBubble('user',text,inner);
  const typing=renderBubble('orion','__typing__',inner);
  chatEl.scrollTop=chatEl.scrollHeight;
  try{
    const data=await callApi({model:MODELS[modelIdx].id,messages:s.history});
    typing.remove();
    const reply=data?.choices?.[0]?.message?.content??'No response.';
    s.history.push({role:'assistant',content:reply});
    renderBubble('orion',reply,inner);
    chatEl.scrollTop=chatEl.scrollHeight;
  }catch(err){
    typing.remove();
    renderBubble('orion',`Could not get a response. (${err.message})`,inner);
    chatEl.scrollTop=chatEl.scrollHeight;
  }
  renderSidebar();
  busy=false; sendBtn.disabled=false;
  promptEl.focus();
}

document.getElementById('newChatBtn').onclick=()=>newSession();
document.getElementById('clearAllBtn').onclick=()=>{
  sessions=[]; activeId=null;
  topTitle.textContent='New Chat';
  modelIdx=0; updatePill();
  const inner=chatEl.querySelector('.chat-inner');
  if(inner) inner.remove();
  showWelcome();
  renderSidebar();
};
sendBtn.onclick=sendMessage;
promptEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
promptEl.addEventListener('input',()=>{promptEl.style.height='auto';promptEl.style.height=Math.min(promptEl.scrollHeight,200)+'px';});

// ── Personality modal ──
const overlay      = document.getElementById('modal-overlay');
const customPrompt = document.getElementById('customPrompt');
const pBtn         = document.getElementById('personalityBtn');

function openModal(){
  customPrompt.value = currentSystemPrompt === SYSTEM_PROMPT ? '' : currentSystemPrompt;
  // Highlight matching preset
  document.querySelectorAll('.preset-btn').forEach(b=>{
    b.classList.toggle('selected', b.dataset.preset === currentSystemPrompt);
  });
  overlay.classList.add('open');
  setTimeout(()=>customPrompt.focus(),80);
}
function closeModal(){ overlay.classList.remove('open'); }

pBtn.onclick = openModal;
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalCancel').onclick = closeModal;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

document.querySelectorAll('.preset-btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.preset-btn').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    customPrompt.value = b.dataset.preset;
  };
});

document.getElementById('modalApply').onclick=()=>{
  const val = customPrompt.value.trim();
  currentSystemPrompt = val || SYSTEM_PROMPT;
  // Update system prompt in active session
  if(activeId){
    const s=activeSession();
    if(s) s.history[0]={role:'system',content:currentSystemPrompt};
  }
  // Visual feedback on button
  pBtn.classList.toggle('active', currentSystemPrompt !== SYSTEM_PROMPT);
  closeModal();
};

newSession();
</script>
